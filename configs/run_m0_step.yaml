# Aligned-STEP overfit (domain-gap fork). Same as run_m0.yaml but trains on the STEP
# tessellations (_m0_step9) with the transferred manufacturer labels. Question: can the
# model LEARN CPs from STEP-domain input? Pass = STEP overfit F1 high -> the whole gap is
# train/infer domain mismatch (fix = train on STEP-domain data). Fail even here -> the
# target semantics need rework. augment OFF, high epochs, no early stop.
backbone: hierpoint
init_from: checkpoints/cp_hp_pretrain_synth_best.ckpt
run_name: cp_m0_step
seed: 0
split_seed: 0

split_group: none
val_frac: 0.15
test_frac: 0.0

device: cuda
max_gpu_verts: 14000
fwd_verts: 48000
knn_cache_dir: _prep_cache

epochs: 300
eval_every: 20
patience: 200
min_delta: 0.0
ckpt_every: 50
snapshot_every: 300

augment: 0
aug_rotate: false

heat_loss: centernet
centernet_alpha: 1.5
w_heat: 1.0
w_off: 5.0
w_dir: 2.0
lr: 0.001
lr_schedule: cosine
weight_decay: 0.0005
grad_clip: 1.0
