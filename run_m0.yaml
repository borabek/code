# M0 gate (TRAINING_JSON_WSCAD_90 plan, section 9): can the architecture even LEARN
# the 9 bridge JSON parts? Pure memorisation test -- train on the 9, eval on the 9.
# augment OFF (we WANT overfit), split_group none, high epochs, no early stop.
# Pass = JSON overfit F1 >= 0.95. Then the same ckpt is run on the 9 STEP twins
# (transfer target >= 0.85). This separates "cannot learn" from "cannot transfer".
backbone: hierpoint
init_from: checkpoints/cp_hp_pretrain_synth_best.ckpt
run_name: cp_m0_overfit
seed: 0
split_seed: 0

split_group: none
val_frac: 0.15
test_frac: 0.0

device: cuda
max_gpu_verts: 14000
fwd_verts: 48000
knn_cache_dir: _prep_cache

epochs: 300
eval_every: 20
patience: 200
min_delta: 0.0
ckpt_every: 50
snapshot_every: 300

augment: 0
aug_rotate: false

heat_loss: centernet
centernet_alpha: 1.5
w_heat: 1.0
w_off: 5.0
w_dir: 2.0
lr: 0.001
lr_schedule: cosine
weight_decay: 0.0005
grad_clip: 1.0
