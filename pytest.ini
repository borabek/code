; PYTEST KAPSAMI -- yalnizca tests/ toplanir.
;
; NEDEN (2026-08-01 denetimi): kokte pytest ADLANDIRMASINA uyan ama aslinda BETIK olan
; dosyalar var (step_funnel_test.py, _thr_test.py, test_core.py). pytest bunlari toplayip
; MODUL SEVIYESINDEKI kodu calistiriyordu; step_funnel_test.py `sys.argv[1]`i okuyor ve
; `pytest -q` cagrisinda "-q"yu sayi sanip COLLECTION'i patlatiyordu:
;     ValueError: invalid literal for int() with base 10: '-q'
; Sonuc: kokten `pytest -q` HIC calismiyordu; testler yalnizca `pytest tests/` ile kosuyordu.
; Bu, "135 gecti" raporunun aslinda tam kapsam OLMADIGI anlamina geliyordu.
;
; Cozum kapsami daraltmak: gercek testler tests/ altinda. Kokteki betikler ayri arac,
; test degil -- toplanmamalari DOGRU davranis.
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
; `slow` = gercek STEP dosyasi mesh'leyen testler (saniyeler surer, ama GERCEK regresyon
; yakalar -- ornek: ucuncu mesh kademesi). Kayitli olmayan mark PytestUnknownMarkWarning
; uretiyordu; uyari birakmiyoruz.
markers =
    slow: gercek CAD dosyasi isleyen yavas test
