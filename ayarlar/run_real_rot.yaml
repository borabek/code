# cp_real_rot — isolate FRAME. Identical to run_real_v1.yaml (ORIGINAL Desktop\JSON
# corpus, NOT densified) but adds aug_cube_rotate: each augmented clone is one of the 24
# octahedral (axis-preserving) rotations. Density is left alone (densification was a dead
# end: it broke sparse-JSON and didn't add STEP curvature). Single variable vs cp_real_v1 =
# cube-rotation. Tested STEP NATIVE (no pre-align) = deployment-realistic. Baseline to beat:
# cp_real_v1 STEP native F1 0.093.
backbone: hierpoint
init_from: checkpoints/cp_hp_pretrain_synth_best.ckpt
run_name: cp_real_rot
seed: 0
split_seed: 0

split_group: geometry
val_frac: 0.15
test_frac: 0.15
exclude_parts_file: _bridge_test.txt

device: cuda
max_gpu_verts: 14000
fwd_verts: 48000
knn_cache_dir: _prep_cache

epochs: 90
eval_every: 5
patience: 8
min_delta: 0.005
ckpt_every: 5
snapshot_every: 10

augment: 2
aug_rotate: false
aug_cube_rotate: true
aug_jitter_frac: 0.005
aug_reflect: true
aug_dropout_frac: 0.10
aug_cable_frac: 0.20

heat_loss: centernet
centernet_alpha: 1.5
w_heat: 1.0
w_off: 5.0
w_dir: 2.0
lr: 0.001
lr_schedule: cosine
weight_decay: 0.0005
grad_clip: 1.0
