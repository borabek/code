# cp_real_smoke — pipeline sanity check BEFORE the real ADIM 3 run.
# Purpose: prove the real-corpus path does not crash + the val path runs every
# epoch + loss decreases. NOT a real result. Identical recipe to run_real_v1.yaml
# except: 10 epochs, eval_every 1, patience disabled, separate run_name.
#   - rotation OFF (98.1% axis-aligned; continuous SO(3) forbidden)
#   - bridge 9 quarantined via exclude_parts_file (no teacher->student leak)
#   - min_votes stays 1 (ADIM 1 ceiling: F1 0.972 at mv=1 vs 0.859 at mv=2)
backbone: hierpoint
init_from: checkpoints/cp_hp_pretrain_synth_best.ckpt
run_name: cp_real_smoke
seed: 0
split_seed: 0

split_group: geometry
val_frac: 0.15
test_frac: 0.15
exclude_parts_file: _bridge_test.txt

device: cuda
max_gpu_verts: 14000
fwd_verts: 48000
knn_cache_dir: _prep_cache   # cache the 2-6h pooling-hierarchy prebuild; reused by run_real_v1 (same corpus/split/seed -> same graphs)

epochs: 10
eval_every: 1
patience: 100
min_delta: 0.0
ckpt_every: 5
snapshot_every: 100

augment: 2
aug_rotate: false
aug_jitter_frac: 0.005
aug_reflect: true
aug_dropout_frac: 0.10
aug_cable_frac: 0.20

heat_loss: centernet
centernet_alpha: 1.5
w_heat: 1.0
w_off: 5.0
w_dir: 2.0
lr: 0.001
lr_schedule: cosine
weight_decay: 0.0005
grad_clip: 1.0
